[project]
name = "pepkio-gene-hypothesis-roulette"
version = "0.1.0"
description = "Python client for Pepkio gene-hypothesis-roulette tool"
readme = "README_PYPI.md"
authors = [
    { name = "Pepkio Team", email = "support@pepkio.com" }
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.23.0",
    "pydantic>=2.0.0",
]

[project.scripts]
pepkio-gene-hypothesis-roulette = "pepkio_gene_hypothesis_roulette.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepkio_gene_hypothesis_roulette"]

[dependency-groups]
dev = [
    "hatchling>=1.20.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
